releaseNotes: "## Changes since version 0.220127.0436\n\nAll 55 files were corrected
  in place with the fixes in [catalystneuro/brunton-lab-to-nwb PR #14](https://github.com/catalystneuro/brunton-lab-to-nwb/pull/14).
  File names, ECoG, pose data and tables are kept.\n\n**Corrections**\n\n- **One clock
  per file.** Every time in a file now counts from midnight of the recording day.
  In `sub-04_ses-3`, `sub-06_ses-3` and `sub-01_ses-7`, the `starting_time` of the
  ECoG (and of `EOGL`, `EOGR`, `ECGL` and `ECGR` in `sub-01_ses-7`) is now the first
  sample after midnight: 30048.322 s, 29240.566 s and 30682.414 s. Their `ReachEvents`
  timestamps are shifted by the same amounts.\n- **Session start time.** `session_start_time`
  and `timestamps_reference_time` are midnight of the recording day with a +00:00
  offset, for example `2000-01-03T00:00:00+00:00`. Recording day N is January N, 2000.\n
  - **Session description.** It states that times are the hospital's wall-clock times,
  that dates were removed and shifted to January 2000, and that the offset from UTC
  is unknown.\n- **Subject age and sex.** Each subject has its age and sex from Table
  2 of the AJILE12 paper ([10.1038/s41597-022-01280-y](https://doi.org/10.1038/s41597-022-01280-y)).\n
  - **Electrode filtering.** The `filtering` column is now the lowpass cutoff in Hz
  (250.0), as the file's NWB schema requires.\n- The files now pass `dandi validate`
  with no errors.\n\n**Known gaps**\n\n- The offset of the hospital's clock from UTC
  is not known.\n- In `sub-08_ses-4`, the last reach in the `reaches` table starts
  at 86440.332 s, after the end of the day's ECoG and pose. Its entry in `ReachEvents`
  is 40.332 s.\n- The `ECGL` and `ECGR` series in the four sub-01 files with EOG and
  ECG are described as electrooculography.\n- Electrode 0 is marked bad (`good` is
  False) in every file. The counts of good electrodes match Table 2 of the AJILE12
  paper, so the flags are kept as the lab gave them.\n- Pose positions are image pixels,
  but are labelled meters with a conversion of NaN.\n- `Bimanual_overlap` is described
  as a fraction, but holds seconds."
